services:
  relay:
    build: .
    env_file: .env
    ports:
      # Host port: set RELAY_HOST_PORT in .env if 8080 is taken; the container always listens on 8080.
      - "${RELAY_HOST_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
